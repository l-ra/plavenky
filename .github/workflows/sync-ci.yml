name: Validate encrypted synchronization
on:
  push:
    paths:
      - 'index-dev.html'
      - 'sync.php'
      - 'tests/**'
      - '.github/workflows/sync-ci.yml'
  pull_request:
    paths:
      - 'index-dev.html'
      - 'sync.php'
      - 'tests/**'
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: XLSX dependency checksum
        run: test "$(curl -fsSL 'https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js' | openssl dgst -sha384 -binary | openssl base64 -A)" = 'OUW9euuUyxyHcAhTqbhI+Iyb8LMssXt/cpz0yXhs9UWG2/R/uaWdakx/4cfww7Vb'
      - name: Compute inline app script hash
        run: node -e 'const fs=require("fs"),c=require("crypto"),s=fs.readFileSync("index-dev.html","utf8").match(/<script>([\\s\\S]*?)<\\/script>/)[1]; console.log(c.createHash("sha256").update(s).digest("base64"));'
      - name: PHP syntax
        run: php -l sync.php
      - name: Cryptography tests
        run: node tests/sync-crypto.mjs
      - name: Integration tests
        run: node tests/sync-integration.mjs
